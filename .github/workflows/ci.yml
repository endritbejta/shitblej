name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run - no point finishing a
# check against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 (current LTS), not 20: Vite 7 requires ^20.19 || >=22.12, and
          # jsdom's undici reads markAsUncloneable off node:worker_threads,
          # which only exists from 20.18/22.0 - on an older 20.x it is
          # undefined and the test run dies starting its worker.
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      # Fails the build on a known high-severity advisory in a dependency.
      # This repo carried 22 of them - including an improperly-verified HMAC in
      # the JWT chain, a Mongoose $nor sanitization bypass and a critical
      # prototype pollution - with nothing reporting it. Scoped to high and
      # above so a moderate advisory in a dev tool does not block a release;
      # `npm audit` locally shows the full picture.
      - run: npm audit --audit-level=high

      - run: npm run lint

      # The suite boots its own in-memory MongoDB (tests/globalSetup.js), so no
      # service container is needed. tests/setup.js supplies placeholder env
      # vars so the config module validates without a .env.
      - run: npm test

  web:
    name: Web (lint + tests + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shitblej-frontend-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # 22 (current LTS), not 20: Vite 7 requires ^20.19 || >=22.12, and
          # jsdom's undici reads markAsUncloneable off node:worker_threads,
          # which only exists from 20.18/22.0 - on an older 20.x it is
          # undefined and the test run dies starting its worker.
          node-version: 22
          cache: npm
          cache-dependency-path: shitblej-frontend-web/package-lock.json

      - run: npm ci

      # Fails the build on a known high-severity advisory in a dependency.
      # This repo carried 22 of them - including an improperly-verified HMAC in
      # the JWT chain, a Mongoose $nor sanitization bypass and a critical
      # prototype pollution - with nothing reporting it. Scoped to high and
      # above so a moderate advisory in a dev tool does not block a release;
      # `npm audit` locally shows the full picture.
      - run: npm audit --audit-level=high

      - run: npm run lint

      - run: npm test

      # The build is also a check in its own right: it catches broken imports
      # and syntax errors that lint alone misses.
      #
      # VITE_API_URL is required by the build (src/lib/config.js is inlined at
      # build time, and a build without an API origin can only produce an
      # artifact that 404s). CI is not deploying, so a placeholder is correct
      # here - the real origin is set on the deploy target.
      - run: npm run build
        env:
          VITE_API_URL: https://api.invalid

  e2e:
    name: E2E (browser against the real API)
    runs-on: ubuntu-latest
    # Runs after the unit lanes, not alongside them. A browser journey that
    # fails because a unit is broken tells you less, more slowly, than the
    # unit test that already said so - and this lane costs a browser download
    # and a mongod binary.
    needs: [backend, web]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Three installs: the harness itself, plus both applications, because
      # this lane runs the real backend and builds the real frontend rather
      # than any kind of stub.
      - name: Install dependencies
        run: |
          npm ci --prefix backend
          npm ci --prefix shitblej-frontend-web
          npm ci --prefix e2e

      # Chromium only. A second engine doubles the runtime to re-test the same
      # application logic; cross-browser rendering is not what this suite is
      # for.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: e2e

      # mongodb-memory-server downloads a mongod binary on first use and caches
      # it here, so this is worth keeping between runs.
      - name: Cache mongod binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}

      # playwright.config.js starts both servers itself: api-server.js (the
      # real Express app against an in-memory MongoDB) and a production build
      # of the web app served by `vite preview`. It waits on /health/ready
      # rather than /health, so no test runs before the database answers.
      - run: npm test
        working-directory: e2e

      # Only produced on failure (trace/screenshot/video are retain-on-failure),
      # which is exactly when they are worth having.
      - name: Upload the report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
