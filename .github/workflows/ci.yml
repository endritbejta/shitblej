name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run - no point finishing a
# check against code that has already been replaced.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run lint

      # The suite boots its own in-memory MongoDB (tests/globalSetup.js), so no
      # service container is needed. tests/setup.js supplies placeholder env
      # vars so the config module validates without a .env.
      - run: npm test

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: shitblej-frontend-web

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: shitblej-frontend-web/package-lock.json

      - run: npm ci

      - run: npm run lint

      # No test suite on the web app yet, so the build is the check: it catches
      # broken imports and syntax errors that lint alone misses.
      - run: npm run build
