[build]
  base = "shitblej-frontend-web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Inlined into the client bundle at build time (see
  # shitblej-frontend-web/src/lib/config.js), which also means it is readable
  # in the shipped JavaScript - it is configuration, not a secret. Keeping it
  # here rather than in the Netlify UI makes a deploy reproducible from the
  # repo alone, and the build refuses to run without it.
  VITE_API_URL = "https://shitblej.onrender.com"

  # Match CI (.github/workflows/ci.yml). Vite 7 requires ^20.19 || >=22.12,
  # and jsdom's undici needs >=20.18 for node:worker_threads.markAsUncloneable.
  NODE_VERSION = "22"

# Vite content-hashes every file in /assets, so a given URL can never change
# what it returns - which is exactly the case `immutable` exists for. Netlify's
# default is `max-age=0, must-revalidate`, so without this every repeat visit
# spends a conditional request per asset just to be told nothing changed.
#
# index.html is deliberately NOT cached: it carries the hashed asset names and
# the inlined stylesheet, so it has to be revalidated for a deploy to be picked
# up at all.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
